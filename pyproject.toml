[project]
name = "ptcg"
version = "0.1.0"
description = "Agent for the Pokémon TCG AI Battle Challenge (Kaggle)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "kaggle-environments==1.30.1",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "kaggle",
]
train = [
    "torch>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ptcg"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
